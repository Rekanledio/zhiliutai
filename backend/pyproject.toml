[project]
name = "zhiliutai-backend"
version = "0.1.0"
description = "FastAPI backend for the Zhiliutai personal knowledge base"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite==0.21.0",
    "alembic==1.16.4",
    "fastapi==0.116.1",
    "faster-whisper==1.2.1",
    "httpx==0.28.1",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "pypdf==5.9.0",
    "pydantic-settings==2.10.1",
    "python-multipart==0.0.20",
    "python-docx==1.2.0",
    "qdrant-client[fastembed]==1.15.1",
    "sentence-transformers==6.0.0",
    "sqlalchemy[asyncio]==2.0.43",
    "structlog==25.4.0",
    "uvicorn[standard]==0.35.0",
    "mcp==2.1.1",
]

[dependency-groups]
dev = [
    "mypy==1.17.1",
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "reportlab==4.4.3",
    "ruff==0.12.9",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
